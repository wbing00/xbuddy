services:
  - type: web
    name: xbuddy-research
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "22"
      - key: FUYAO_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
